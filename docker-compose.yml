services:
  personal-repo-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PERSONAL_REPO_MCP_TOKEN: ${PERSONAL_REPO_MCP_TOKEN:?set PERSONAL_REPO_MCP_TOKEN}
      PERSONAL_REPO_MCP_REPOSITORIES: ${PERSONAL_REPO_MCP_REPOSITORIES:-[]}
      PERSONAL_REPO_MCP_ALLOWED_HOSTS: ${PERSONAL_REPO_MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*}
      PERSONAL_REPO_MCP_ALLOWED_ORIGINS: ${PERSONAL_REPO_MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*,http://[::1]:*}
      PERSONAL_REPO_MCP_ROOT: /srv/personal-repo-mcp/repositories
      PERSONAL_REPO_MCP_HOST: 0.0.0.0
      PERSONAL_REPO_MCP_PORT: 8000
    volumes:
      - ./repositories:/srv/personal-repo-mcp/repositories

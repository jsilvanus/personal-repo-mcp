services:
  personal-repo-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PERSONAL_REPO_MCP_TOKEN: ${PERSONAL_REPO_MCP_TOKEN:?set PERSONAL_REPO_MCP_TOKEN}
      PERSONAL_REPO_MCP_GITHUB_PAT: ${PERSONAL_REPO_MCP_GITHUB_PAT:?set PERSONAL_REPO_MCP_GITHUB_PAT}
      PERSONAL_REPO_MCP_CONFIG: /etc/personal-repo-mcp/repositories.json
      PERSONAL_REPO_MCP_ROOT: /srv/personal-repo-mcp/repositories
      PERSONAL_REPO_MCP_ALLOWED_HOSTS: ${PERSONAL_REPO_MCP_ALLOWED_HOSTS:?set PERSONAL_REPO_MCP_ALLOWED_HOSTS}
      PERSONAL_REPO_MCP_ALLOWED_ORIGINS: ${PERSONAL_REPO_MCP_ALLOWED_ORIGINS:?set PERSONAL_REPO_MCP_ALLOWED_ORIGINS}
      PERSONAL_REPO_MCP_HOST: 0.0.0.0
      PERSONAL_REPO_MCP_PORT: 8000
    volumes:
      - ./config/repositories.json:/etc/personal-repo-mcp/repositories.json:ro
      - ./repositories:/srv/personal-repo-mcp/repositories
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

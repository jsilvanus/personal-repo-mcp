services:
  personal-repo-mcp:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PERSONAL_REPO_MCP_TOKEN_FILE: /run/secrets/mcp_token
      PERSONAL_REPO_MCP_GITHUB_PAT_FILE: /run/secrets/github_pat
      PERSONAL_REPO_MCP_CONFIG: /etc/personal-repo-mcp/repositories.json
      PERSONAL_REPO_MCP_ROOT: /srv/personal-repo-mcp/repositories
      PERSONAL_REPO_MCP_ALLOWED_HOSTS: ${PERSONAL_REPO_MCP_ALLOWED_HOSTS:?set PERSONAL_REPO_MCP_ALLOWED_HOSTS}
      PERSONAL_REPO_MCP_ALLOWED_ORIGINS: ${PERSONAL_REPO_MCP_ALLOWED_ORIGINS:?set PERSONAL_REPO_MCP_ALLOWED_ORIGINS}
      PERSONAL_REPO_MCP_HOST: 0.0.0.0
      PERSONAL_REPO_MCP_PORT: 8000
      # Optional OAuth + OIDC sign-in; empty OIDC_ISSUER keeps it off (see docs/DEPLOYMENT.md).
      PERSONAL_REPO_MCP_PUBLIC_URL: ${PERSONAL_REPO_MCP_PUBLIC_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      PERSONAL_REPO_MCP_OAUTH_DB: /srv/personal-repo-mcp/data/oauth.sqlite
    secrets:
      - mcp_token
      - github_pat
    volumes:
      - ./config/repositories.json:/etc/personal-repo-mcp/repositories.json:ro
      - ./repositories:/srv/personal-repo-mcp/repositories
      - ./data:/srv/personal-repo-mcp/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  mcp_token:
    file: ./secrets/mcp_token
  github_pat:
    file: ./secrets/github_pat

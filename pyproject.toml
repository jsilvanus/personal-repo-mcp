[project]
name = "personal-repo-mcp"
version = "1.0.0"
description = "A persistent, multi-repository MCP server for AI agents running on a VPS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [
  { name = "Juha Itäleino" }
]
dependencies = [
  "mcp>=2.0,<3",
  "starlette>=0.48.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
]

[project.scripts]
personal-repo-mcp = "personal_repo_mcp.main:main"
mcp-config = "personal_repo_mcp.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_repo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
